schema_version: 1
engine: compact
# New tasks run the complete deck lifecycle; authoring is an explicit draft-only option.
workflow: full
title: Untitled course
# These are user-confirmed upper bounds, not promises to spawn that many sessions.
# These are teacher/planner choices, not text to paste onto student slides.
# Review and edit before confirming; technical migration never rewrites an old task.
teaching:
  audience: 非数学专业学生，重视问题动机、计算和直观理解
  proof_depth: minimal  # minimal | explanatory | rigorous
delivery: all
author_concurrency: 4
max_attempts: 2
context_budget_bytes: 262144
provider_timeout_seconds: 1200
# Separate, bounded retries of safe read-only operations; never retries unknown creates/runs.
recovery:
  transient_tool_retries: 2
  host_observation_retries: 2
quality:
  browser: auto
  timeout_seconds: 1800
# Empty means the host's real capacity is unknown; the runner must not spawn.
provider:
  mode: bridge
  command: []
  handle_limit: null
  external_handles: 0
  recovery_reserve: 2
  supports_close: false
  supports_reset: false
# Each unit is one semantic writing job, not six process-document stages.
presentations: []
# Example:
# - id: p01
#   title: Vectors and economic quantities
#   units:
#   - id: l01
#     title: Coordinates and units
#     brief: Explain coordinates as quantities with units. Include an example and diagnostic question.
#     sources: [sources/chapter-1.txt]
