schema_version: 3
presentation_id: "[[PRESENTATION_ID]]"
unit_id: "[[UNIT_ID]]"
task_kind: "[[TASK_KIND]]"
items:
  - prompt_slide: "[[PROMPT_SLIDE_ID]]"
    response_slide: "[[RESPONSE_SLIDE_ID]]"
    purpose: "[[PURPOSE]]"
    preceding_comparison: "[[WHY_NOT_A_REPEAT]]"
    requires_fresh_inference: true
    information_state:
      available_before_prompt:
        - "[[PREREQUISITE_INFORMATION_ALREADY_TAUGHT]]"
      intentionally_withheld: []
    new_inference: "[[NEW_INFERENCE_REQUIRED]]"
    decision_unit: "[[ONE_COHERENT_DECISION]]"
    prerequisite_available: true
    cue_leakage_audit: "[[WHY_THE_PROMPT_DOES_NOT_REVEAL_THE_ANSWER]]"
    composite_option_check:
      single_decision: true
      rationale: "[[WHY_EACH_OPTION_ANSWERS_THE_SAME_QUESTION]]"
    selection_rationale: "[[SELECTION_RATIONALE]]"
    visible_labels: [A, B, C, D]
    option_audit:
      A:
        stem_compatible: true
        truth_status: correct
        wording_check: "[[WORDING_CHECK]]"
        justification: "[[JUSTIFICATION]]"
      B:
        stem_compatible: true
        truth_status: incorrect
        wording_check: "[[WORDING_CHECK]]"
        misconception: "[[MISCONCEPTION]]"
