schema_version: 3
task_kind: "[[TASK_KIND_CODE]]"
production_mode: "[[PRODUCTION_MODE]]"
stage_profile: "[[AUTHORING_STAGE_PROFILE]]"
runtime_profile_source: TASK-RUNTIME-PROFILE.yaml
runtime_profile_user_editable_until_task_confirmation: true
runtime_profile_immutable_after_task_confirmation: true
runtime_changes_during_task: forbidden
runtime_selection_note: >-
  The user chooses all model and reasoning settings in the task-local runtime profile before
  confirming TASK.md. Agents may resolve those fixed entries but may not change them dynamically.
planner_delegation:
  main_agent_exclusive: [write_or_revise_TASK_md]
  all_other_planner_operations_may_be_delegated: true
  semantic_ownership_remains_with_planner: true
planner_supervision:
  mode: deterministic_event_driven
  fallback_interval_seconds: 1200
  wake_on_delivery: true
  model_polling_for_routine_state: forbidden
coordinator_supervision:
  mode: deterministic_event_driven
  author_interval_seconds: 300
  review_interval_seconds: 300
authoring:
  one_fixed_author_per_lesson: true
  lazy_unit_initialization: true
  max_parallel_lesson_authors: 6
  current_presentation_wip_limit: 1
  next_presentation_authoring_wip_limit: 1
  speculative_prefreeze_worker_launch: forbidden
  stage_profile: "[[AUTHORING_STAGE_PROFILE]]"
  planner_owns_assignment_semantics: true
  approved_batch_expansion_counts_as_planner_written: true
  program_may_expand_approved_batch_plan: true
  original_lesson_author_may_close_after_handoff: true
  post_review_revision_role: deck-revision-author
review:
  mandatory_full_deck_rounds: 1
  channels: [language, domain_accuracy, layout, pedagogy, audience]
  each_reviewer_reads_entire_frozen_deck: true
  launch_only_after_freeze: true
  post_review_verification: none
  deck_revision_author_completed_revision_is_sufficient_for_release: true
release:
  launch_only_in_release_ready: true
  prospective_hold_threads: forbidden
critical_path:
  priority_order:
    - finish_current_review_revision_or_release
    - finish_current_presentation
    - start_next_ready_presentation
    - prepare_future_metadata_without_model_workers
  ready_wait_warning_seconds: 900
  reserve_unallocated_capacity: 2
course_time_strategy:
  enforcement: advisory_not_hard_gate
  prepared_to_nominal_ratio_default: 1.5
  core_path_targets_nominal_duration: true
  extension_examples_after_core_path: true
  stop_at_class_end_without_finishing_extensions: true
  organization_basis: numbered_course_meetings
interaction:
  canonical_record: INTERACTION-RECORD.yaml
  compatibility_views_are_generated: true
  course_multiple_choice_per_unit:
    minimum: 2
    maximum: 3
  academic_report_multiple_choice_per_unit:
    minimum: 0
    maximum: null
assets:
  python_generated: disabled
  generated_svg_min_font_pt: 18
  decision_order:
    - native_text_or_formula
    - markdown_table
    - theme_css_layout
    - simple_manual_svg
    - approved_existing_resource
    - python_generated_figure
online_resources:
  geogebra:
    enabled: true
    site_scope: geogebra.org
    max_search_queries_per_unit: 3
    max_selected_links_per_unit: 3
    selected_resource_requires_verified_status: true
reference_access:
  workers: extracted_text_only
  original_pdf_access: system_ingestion_only
  worker_pdf_open: forbidden
  worker_pdf_conversion: forbidden
  worker_ocr: forbidden
thread_lifecycle:
  mode: close_or_reuse
  close_lesson_author_after_handoff: allowed
  reuse_idle_when_release_is_unavailable: true
  interrupt_that_retains_a_handle_counts_as_release: false
  reserve_unallocated_capacity: 2
token_accounting:
  enabled: true
  collection_mode: workflow_milestones
  exact_counters_only: true
  periodic_model_polling: forbidden
marp:
  version_policy: exact_pinned_version
  version: "4.5.0"
  lock_file: TOOLCHAIN-LOCK.yaml
  smoke_test_required_before_production: true
  browser: chromium
engine_changes:
  in_task_hot_patch: forbidden
  technical_bug_requires_task_policy_amendment: true
  workflow_engine_refactoring_is_separate_work: true
pdf_limits:
  warning_min_text_pt: 12
  error_min_text_pt: 8
inspection:
  screenshots: forbidden
  model_vision: forbidden
  persistent_html: forbidden
  temporary_html_overflow_check: author_and_release_gate
  reviewer_rechecks_mechanical_overflow: false
  incremental_author_checks: true
  full_checks_at: [freeze, release]
