schema_version: 2
task_kind: "[[TASK_KIND_CODE]]"
model_policy_source: MODEL-POLICY.yaml
planner_runtime:
  model: gpt-5.6-sol
  reasoning_effort: max
worker_runtime:
  model: gpt-5.6-sol
  reasoning_effort: high
reasoning_effort_note: >-
  The planner always defaults to max because it owns scope and assignments. Execution and review
  workers default to high; a reconfirmed task may raise selected worker roles to max.
planner_supervision:
  interval_seconds: 1200
  wake_on_delivery: true
coordinator_supervision:
  author_interval_seconds: 300
  review_interval_seconds: 300
authoring:
  one_worker_per_content_unit: true
  max_parallel_lesson_authors: 6
  max_parallel_presentations: 2
  stage_profile: "[[AUTHORING_STAGE_PROFILE]]"
  planner_writes_every_assignment: true
review:
  mandatory_full_deck_rounds: 1
  channels: [language, domain_accuracy, layout, pedagogy, audience]
  post_review_verification: none
  author_completed_revision_is_sufficient_for_release: true
course_time_strategy:
  enforcement: advisory_not_hard_gate
  prepared_to_nominal_ratio_default: 1.5
  core_path_targets_nominal_duration: true
  extension_examples_after_core_path: true
  stop_at_class_end_without_finishing_extensions: true
  organization_basis: numbered_course_meetings
interaction:
  course_multiple_choice_per_unit:
    minimum: 2
    maximum: 3
  academic_report_multiple_choice_per_unit:
    minimum: 0
    maximum: null
assets:
  python_generated: disabled
  generated_svg_min_font_pt: 18
  decision_order:
    - native_text_or_formula
    - markdown_table
    - theme_css_layout
    - simple_manual_svg
    - approved_existing_resource
    - python_generated_figure
online_resources:
  geogebra:
    enabled: true
    site_scope: geogebra.org
    max_search_queries_per_unit: 3
    max_selected_links_per_unit: 3
    selected_resource_requires_verified_status: true
reference_access:
  workers: extracted_text_only
  original_pdf_access: system_ingestion_only
  worker_pdf_open: forbidden
  worker_pdf_conversion: forbidden
  worker_ocr: forbidden
thread_lifecycle:
  mode: close_or_reuse
  reuse_idle_when_release_is_unavailable: true
  interrupt_that_retains_a_handle_counts_as_release: false
  reserve_unallocated_capacity: 2
token_accounting:
  enabled: true
  sample_interval_seconds: 300
  exact_counters_only: true
marp:
  version_policy: unpinned_latest_at_install_time
  browser: auto
pdf_limits:
  warning_min_text_pt: 12
  error_min_text_pt: 8
inspection:
  screenshots: forbidden
  model_vision: forbidden
  persistent_html: forbidden
  temporary_html_overflow_check: author_and_release_gate
  reviewer_rechecks_mechanical_overflow: false
