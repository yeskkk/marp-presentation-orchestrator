schema_version: 2
rounds:
  - name: full
    scope: complete_frozen_deck
    channels: [language, domain_accuracy, layout, pedagogy, audience]
    may_open_findings: true
post_review:
  author_must_respond_to_every_finding: true
  author_must_complete_modification_checklist: true
  reviewer_recheck: forbidden
  acceptance_verifier: none
  finding_resolution_status_required: false
  release_after_author_workflow: automatic
screenshots: forbidden
model_vision: forbidden
