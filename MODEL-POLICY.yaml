schema_version: 3
purpose: runtime-capability-validation-only
selection_scope: task
task_runtime_profile: TASK-RUNTIME-PROFILE.yaml
agent_may_select_or_modify_runtime: false
reasoning_effort_values: [low, medium, high, max]
model_identifier_policy: non_empty_user_selected_runtime_id
notes:
  - Runtime defaults and any refinements live only in each task's TASK-RUNTIME-PROFILE.yaml.
  - The user may edit that file before confirming TASK.md.
  - The confirmed task snapshot is immutable; agents never escalate, downgrade, substitute, or retry with a different runtime.
