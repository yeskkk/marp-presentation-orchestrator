[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marp-presentation-orchestrator"
version = "0.6.0"
description = "A Codex + Marp workflow for parallel authoring, production profiles, critical-path scheduling, one mandatory full-deck review, and PDF-only delivery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project scaffold generated for the user" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "Pillow>=11.0",
  "playwright>=1.48,<2",
  "PyMuPDF>=1.25",
  "pypdf>=5.1",
  "pytesseract>=0.3.13",
  "PyYAML>=6.0",
  "requests>=2.32",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
figures = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "sympy>=1.13",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
mpres = "mpres.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mpres"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
